# ==========================================
# SERVEUR
# ==========================================
server.port=8082
spring.application.name=transaction-service


# ==========================================
# COMMUNICATION AVEC ACCOUNT-SERVICE
# ==========================================
account.service.url=http://localhost:8081


# ==========================================
# CONFIG SERVER
# Configuration temporaire : Config Server non disponible
# ==========================================
spring.cloud.config.enabled=false


# ==========================================
# BASE DE DONNEES H2
# ==========================================
spring.datasource.url=jdbc:h2:mem:transaction_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==========================================
# CONSOLE H2
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ==========================================
# GRAPHQL
# ==========================================
spring.graphql.graphiql.enabled=true


# ==========================================
# LIMITE MAXIMALE D'UNE TRANSACTION
# ==========================================
bank.transaction.max-amount=1000


# ==========================================
# RESILIENCE4J - CIRCUIT BREAKER
# ==========================================
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=5
resilience4j.circuitbreaker.instances.accountService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s