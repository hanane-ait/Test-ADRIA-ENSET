# Serveur Gateway
server.port=8080
spring.application.name=gateway-service

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Route vers Account-Service
spring.cloud.gateway.server.webmvc.routes[0].id=account-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ACCOUNT-SERVICE1
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/accounts/**

# Route vers Transaction-Service
spring.cloud.gateway.server.webmvc.routes[1].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://TRANSACTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/transactions/**