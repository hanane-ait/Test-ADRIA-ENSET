# Serveur
server.port=8083

# Nom du microservice
spring.application.name=chatbot-service

# Configuration locale
spring.cloud.config.enabled=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b

# Client MCP : Account-Service
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.toolcallback.enabled=true

spring.ai.mcp.client.streamable-http.connections.account-service.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.account-service.endpoint=/mcp

# Client MCP : Transaction-Service
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=http://localhost:8082
spring.ai.mcp.client.streamable-http.connections.transaction-service.endpoint=/mcp